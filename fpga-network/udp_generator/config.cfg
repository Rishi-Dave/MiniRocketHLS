[connectivity]
# UDP line-rate packet generator for pc161's U280 (scoped 2026-07-07).
# Structural sibling of ../minirocket_fused/config.cfg, minus the compute
# kernel's HBM ports (this kernel has none) and minus pktDropper (this
# kernel drains-and-discards M_AXIS_nl2sk itself -- see
# udp_generator.cpp's udp_generator_drain).
#
# NOT LINKED / NOT BUILT YET -- source + config only, per the 2026-07-07
# scoping task (no v++ hw build, no hardware access). Before any hw build:
# run csim, then a bounded COSIM_MAX_WINDOWS cosim liveness check (see
# make.tcl.in), matching the process minirocket_fused went through before
# its own v4 free-run hw build.

nk=udp_generator:1:udp_generator_1
nk=cmac_0:1:cmac_0_1
nk=networklayer:1:networklayer_1

slr=cmac_0_1:SLR2

stream_connect=cmac_0_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_0_1.S_AXIS

# Generator output -> NetLayer TX (app-to-socket). Depth 1024 matches the
# fused/dpr convention (gives the link slack under backpressure).
stream_connect=udp_generator_1.output_stream:networklayer_1.S_AXIS_sk2nl:1024

# NetLayer's app-inbound port MUST be connected per NetLayers/kernel.xml
# (mandatory port, not optional) even though this generator expects no
# real inbound UDP traffic -- terminate it directly in the generator kernel
# (see udp_generator_drain) instead of pulling in pktDropper as a separate
# kernel/IP.
stream_connect=networklayer_1.M_AXIS_nl2sk:udp_generator_1.input_drain:1024

[advanced]
param=compiler.userPostSysLinkOverlayTcl=/home/rdave009/minirocket-hls/MiniRocketHLS/fpga-network/Ethernet/post_sys_link.tcl
[vivado]
prop=run.impl_1.strategy=Performance_NetDelay_low
