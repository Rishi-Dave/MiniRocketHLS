[connectivity]
# Fused CONV+PPV network wrapper, structural sibling of
# fpga-network/config.cfg (minirocket_dpr). Top name is
# minirocket_fused_inference (distinct from minirocket_dpr's
# minirocket_inference so the two kernels can be linked side by side without
# a name clash -- see include/minirocket_fused.hpp). pktDropper kept inline
# between NetLayer and the kernel's input stream for the same reason as the
# dpr config: if the kernel can't drain (e.g. still buffering/computing a
# long series), pktDropper silently drops packets instead of backpressuring
# CMAC RX and wedging the GT.

nk=minirocket_fused_inference:1:minirocket_fused_inference_1
nk=cmac_0:1:cmac_0_1
nk=networklayer:1:networklayer_1
nk=pktDropper:1:pktDropper_1

slr=cmac_0_1:SLR2

# CU 1 - model-parameter HBM ports (mirrors minirocket_dpr's port map)
sp=minirocket_fused_inference_1.coefficients:HBM[2]
sp=minirocket_fused_inference_1.intercept:HBM[3]
sp=minirocket_fused_inference_1.scaler_mean:HBM[4]
sp=minirocket_fused_inference_1.scaler_scale:HBM[5]
sp=minirocket_fused_inference_1.dilations:HBM[6]
sp=minirocket_fused_inference_1.num_features_per_dilation:HBM[7]
sp=minirocket_fused_inference_1.biases:HBM[8]

stream_connect=cmac_0_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_0_1.S_AXIS

# Kernel output (predictions) goes straight back to NetLayer.
stream_connect=minirocket_fused_inference_1.output_predictions:networklayer_1.S_AXIS_sk2nl:1024

# NetLayer outbound to user kernel is routed through pktDropper.
stream_connect=networklayer_1.M_AXIS_nl2sk:pktDropper_1.input:1024
stream_connect=pktDropper_1.output:minirocket_fused_inference_1.input_timeseries:1024

[advanced]
param=compiler.userPostSysLinkOverlayTcl=/home/rdave009/minirocket-hls/MiniRocketHLS/fpga-network/Ethernet/post_sys_link.tcl
#param=compiler.worstNegativeSlack=-2
#param=compiler.errorOnHoldViolation=false
[vivado]
prop=run.impl_1.strategy=Performance_NetDelay_low
