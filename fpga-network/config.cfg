[connectivity]
# MiniRocket kernel with pktDropper inline (v3 pktdropper rebuild 2026-05-26).
# pktDropper sits between NetLayer's M_AXIS_nl2sk and the kernel's input
# stream. When the kernel can't drain, pktDropper silently drops packets
# instead of backpressuring CMAC RX (which would otherwise wedge the GT;
# see saturation_pivot 2026-05-06 and prior cross-node sweep findings).

nk=minirocket_inference:1:minirocket_inference_1
nk=cmac_0:1:cmac_0_1
nk=networklayer:1:networklayer_1
nk=pktDropper:1:pktDropper_1

slr=cmac_0_1:SLR2

# CU 1 - All 9 HBM ports assigned
# sp=minirocket_inference_1.time_series_input:HBM[0]
# sp=minirocket_inference_1.prediction_output:HBM[1]
sp=minirocket_inference_1.coefficients:HBM[2]
sp=minirocket_inference_1.intercept:HBM[3]
sp=minirocket_inference_1.scaler_mean:HBM[4]
sp=minirocket_inference_1.scaler_scale:HBM[5]
sp=minirocket_inference_1.dilations:HBM[6]
sp=minirocket_inference_1.num_features_per_dilation:HBM[7]
sp=minirocket_inference_1.biases:HBM[8]

stream_connect=cmac_0_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_0_1.S_AXIS

# Kernel output (predictions) goes straight back to NetLayer.
# Depth :1024 matches Prith's nlp config — gives the link a buffer so
# the dropper has slack to do its job.
stream_connect=minirocket_inference_1.output_predictions:networklayer_1.S_AXIS_sk2nl:1024

# NetLayer outbound to user kernel is now routed through pktDropper.
# pktDropper buffers up to its internal FIFO depth (default 2) and drops
# anything more when minirocket_inference_1 is backpressured.
stream_connect=networklayer_1.M_AXIS_nl2sk:pktDropper_1.input:1024
stream_connect=pktDropper_1.output:minirocket_inference_1.input_timeseries:1024

# CU 2 (commented out, kept for reference for future multi-CU rebuilds)
# sp=krnl_top_2.time_series_input:HBM[9]
# sp=krnl_top_2.prediction_output:HBM[10]
# sp=krnl_top_2.coefficients:HBM[11]
# sp=krnl_top_2.intercept:HBM[12]
# sp=krnl_top_2.scaler_mean:HBM[13]
# sp=krnl_top_2.scaler_scale:HBM[14]
# sp=krnl_top_2.dilations:HBM[15]
# sp=krnl_top_2.num_features_per_dilation:HBM[16]
# sp=krnl_top_2.biases:HBM[17]



[advanced]
param=compiler.userPostSysLinkOverlayTcl=/home/rdave009/minirocket-hls/MiniRocketHLS/fpga-network/Ethernet/post_sys_link.tcl
#param=compiler.worstNegativeSlack=-2
#param=compiler.errorOnHoldViolation=false
[vivado]
prop=run.impl_1.strategy=Performance_NetDelay_low
