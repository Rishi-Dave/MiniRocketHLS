# v++ link config for multirocket_axis_inference + CMAC + NetLayer.
# Mirrors hydra_axis/config_axis.cfg. MultiRocket has 10 m_axi ports vs
# HYDRA's 7, so we use HBM[2..11].

[connectivity]
nk=multirocket_axis_inference:1:multirocket_axis_inference_1
nk=cmac_0:1:cmac_0_1
nk=networklayer:1:networklayer_1

slr=cmac_0_1:SLR2

# 10 m_axi ports — wider than HYDRA / MiniRocket because MultiRocket has
# two representations (original + first-order difference) each with its
# own dilations / num_features / biases tables.
sp=multirocket_axis_inference_1.coefficients:HBM[2]
sp=multirocket_axis_inference_1.intercept:HBM[3]
sp=multirocket_axis_inference_1.scaler_mean:HBM[4]
sp=multirocket_axis_inference_1.scaler_scale:HBM[5]
sp=multirocket_axis_inference_1.dilations_0:HBM[6]
sp=multirocket_axis_inference_1.num_features_per_dilation_0:HBM[7]
sp=multirocket_axis_inference_1.biases_0:HBM[8]
sp=multirocket_axis_inference_1.dilations_1:HBM[9]
sp=multirocket_axis_inference_1.num_features_per_dilation_1:HBM[10]
sp=multirocket_axis_inference_1.biases_1:HBM[11]

# CMAC <-> NetLayer (verbatim).
stream_connect=cmac_0_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_0_1.S_AXIS

# Compute kernel <-> NetLayer.
# After Prith's drop kernel lands (Phase 2), insert it on the
# `M_AXIS_nl2sk` -> `multirocket_axis_inference_1.input_timeseries` edge.
stream_connect=multirocket_axis_inference_1.output_predictions:networklayer_1.S_AXIS_sk2nl
stream_connect=networklayer_1.M_AXIS_nl2sk:multirocket_axis_inference_1.input_timeseries

[advanced]
param=compiler.userPostSysLinkOverlayTcl=__FPGA_NETWORK_DIR__/Ethernet/post_sys_link.tcl

[vivado]
prop=run.impl_1.strategy=Performance_NetDelay_low
