# v++ link config for hydra_axis_inference + CMAC + NetLayer.
#
# Mirrors fpga-network/config.cfg. Use from a build directory that has
# hydra_axis_inference.xo, cmac_0.xo, networklayer.xo in its iprepo.
# The packet-drop module (Phase 2, from Prith) inserts on the
# `networklayer_1.M_AXIS_nl2sk` -> `hydra_axis_inference_1.input_timeseries`
# edge once it lands; for now that edge is direct.

[connectivity]
nk=hydra_axis_inference:1:hydra_axis_inference_1
nk=cmac_0:1:cmac_0_1
nk=networklayer:1:networklayer_1
nk=pktDropper:1:pktDropper_1

slr=cmac_0_1:SLR2

# HYDRA m_axi ports (7 total — same as MiniRocket fpga-network).
sp=hydra_axis_inference_1.coefficients:HBM[2]
sp=hydra_axis_inference_1.intercept:HBM[3]
sp=hydra_axis_inference_1.scaler_mean:HBM[4]
sp=hydra_axis_inference_1.scaler_scale:HBM[5]
sp=hydra_axis_inference_1.kernel_weights:HBM[6]
sp=hydra_axis_inference_1.biases:HBM[7]
sp=hydra_axis_inference_1.dilations:HBM[8]

# CMAC <-> NetLayer (verbatim from fpga-network/config.cfg).
stream_connect=cmac_0_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_0_1.S_AXIS

# Compute kernel <-> NetLayer, with pktDropper inline on the RX edge —
# same proven topology as fpga-network/minirocket_fused/config.cfg (v6,
# 2026-07-10). The kernel's own ingest is also drop-on-full; pktDropper is
# belt-and-braces parity with the fused dropfull build.
stream_connect=hydra_axis_inference_1.output_predictions:networklayer_1.S_AXIS_sk2nl:1024
stream_connect=networklayer_1.M_AXIS_nl2sk:pktDropper_1.input:1024
stream_connect=pktDropper_1.output:hydra_axis_inference_1.input_timeseries:1024

[advanced]
param=compiler.userPostSysLinkOverlayTcl=__FPGA_NETWORK_DIR__/Ethernet/post_sys_link.tcl

[vivado]
prop=run.impl_1.strategy=Performance_NetDelay_low
