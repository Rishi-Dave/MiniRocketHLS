# HYDRA Stream Hardware Connectivity Configuration
# 3-kernel pipeline: load -> hydra_inference -> store
# Maps m_axi ports to HBM banks on Alveo U280

[connectivity]
nk=load:1
nk=hydra_inference:1
nk=store:1

# HBM port mapping
sp=load_1.time_series_input:HBM[0]
sp=store_1.prediction_output:HBM[1]
sp=hydra_inference_1.coefficients:HBM[2]
sp=hydra_inference_1.intercept:HBM[3]
sp=hydra_inference_1.scaler_mean:HBM[4]
sp=hydra_inference_1.scaler_scale:HBM[5]
sp=hydra_inference_1.kernel_weights:HBM[6]
sp=hydra_inference_1.biases:HBM[7]
sp=hydra_inference_1.dilations:HBM[8]

# AXI-Stream connections between kernels
sc=load_1.output:hydra_inference_1.time_series_input:32
sc=hydra_inference_1.prediction_output:store_1.prediction_input:32
